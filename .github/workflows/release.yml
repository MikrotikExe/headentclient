name: Release (tag -> APK on GitHub Release)

# M402: when a v* tag is pushed, CI builds a SIGNED release APK and publishes
# a GitHub Release with the attachment and its sha256. Manual run: workflow_dispatch
# with the name of an existing tag (for tags pushed before this workflow was added).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      REL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REL_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK (sdkmanager on PATH)
        uses: android-actions/setup-android@v3
        with:
          # M615: by default the action tries to install the `tools` package, which
          # Google has already removed from the SDK repository — the run then fails with
          # „Failed to find package 'tools'". We install only what the build really
          # needs; the action accepts the licenses itself.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up signing (from GitHub secrets)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret — the release must be signed with the production key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK (splits)
        run: |
          gradle :androidApp:assembleRelease
          # move the splits aside, the next build uses the same output directory
          mkdir -p /tmp/rel-apks
          cp androidApp/build/outputs/apk/release/*.apk /tmp/rel-apks/

      - name: Build release APK (universal, separately)
        run: |
          gradle :androidApp:assembleRelease -PuniversalApk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk /tmp/rel-apks/ 2>/dev/null \
            || cp androidApp/build/outputs/apk/release/*-release.apk /tmp/rel-apks/
          cp -f /tmp/rel-apks/*.apk androidApp/build/outputs/apk/release/
          # M544: mapping.txt for the release build (the splits and the universal APK share the same code)
          cp androidApp/build/outputs/mapping/release/mapping.txt "mapping-${REL_TAG#v}.txt" || true

      - name: Prepare artifacts (name + sha256)
        run: |
          # M424: assembleRelease produces several APKs (one per ABI + the universal one).
          # Previously this was "ls | head -1", which alphabetically picked arm64 and threw the rest away
          # -> the release could not be installed on 32-bit devices.
          DIR=androidApp/build/outputs/apk/release
          VER="${REL_TAG#v}"
          ls -la "$DIR" || true
          FOUND=0
          for APK in "$DIR"/*.apk; do
            [ -e "$APK" ] || continue
            case "$APK" in *unsigned*) echo "APK is UNSIGNED — check the signing secrets" >&2; exit 1;; esac
            case "$(basename "$APK")" in
              *universal*)    OUT="HeadentClient-$VER-universal.apk" ;;
              *arm64-v8a*)    OUT="HeadentClient-$VER-arm64-v8a.apk" ;;
              *armeabi-v7a*)  OUT="HeadentClient-$VER-armeabi-v7a.apk" ;;
              *)              OUT="HeadentClient-$VER-universal.apk" ;;
            esac
            cp "$APK" "$OUT"
            sha256sum "$OUT" > "$OUT.sha256"
            echo "-> $OUT ($(du -h "$OUT" | cut -f1))"
            FOUND=$((FOUND+1))
          done
          if [ "$FOUND" -eq 0 ]; then echo "Release APK not found" >&2; exit 1; fi
          # A safeguard against the same bug coming back. The release must be installable
          # on both 32-bit and 64-bit, which holds when either the universal APK exists, or
          # both splits do. The second case happens on a manual run over an older
          # tag whose build.gradle.kts did not produce a universal APK yet.
          if [ ! -f "HeadentClient-$VER-universal.apk" ] &&
             { [ ! -f "HeadentClient-$VER-arm64-v8a.apk" ] ||
               [ ! -f "HeadentClient-$VER-armeabi-v7a.apk" ]; }; then
            echo "The release would cover only one architecture — stopped" >&2
            exit 1
          fi
          cat HeadentClient-*.apk.sha256

      - name: Release notes
        id: notes
        run: |
          if [ -f ".github/release-notes/${REL_TAG}.md" ]; then
            echo "path=.github/release-notes/${REL_TAG}.md" >> "$GITHUB_OUTPUT"
          else
            printf 'Headent Client %s\n' "${REL_TAG#v}" > /tmp/auto-notes.md
            echo "path=/tmp/auto-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: Headent Client ${{ env.REL_TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            HeadentClient-*.apk
            HeadentClient-*.apk.sha256
            mapping-*.txt
