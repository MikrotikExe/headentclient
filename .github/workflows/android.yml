name: Android build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # mapped from secrets so it can be tested in 'if' (secrets cannot be used in if)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK (sdkmanager on PATH)
        uses: android-actions/setup-android@v3
        with:
          # M615: by default the action tries to install the `tools` package, which
          # Google has already removed from the SDK repository — the run then fails with
          # „Failed to find package 'tools'". We install only what the build really
          # needs; the action accepts the licenses itself.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up signing (from GitHub secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build debug APK
        run: gradle :androidApp:assembleDebug
      # M660 / M678: JVM unit tests of the shared module (TsMuxer timing, Htsmsg, SHA-1,
      # DVR classification, radio by service type). The exact task name for the KMP android
      # library (M550) is testAndroidHostTest — allTests would also pull in the iOS targets, which
      # cannot be built on Linux. continue-on-error, so that a failing test does not lose the
      # artifacts (the result is in the log and in the run summary).
      - name: Shared unit tests
        continue-on-error: true
        run: |
          set +e
          gradle :shared:testAndroidHostTest
          rc=$?
          echo "==== test results ===="
          find shared/build -path "*test-results*" -name "TEST-*.xml" | while read f; do
            grep -h -E "<testsuite " "$f" | sed "s/ timestamp=.*//"
            grep -h -E "<failure" "$f" | head -10
          done
          exit $rc
      # M678: a check that the shared module also builds for iOS (commonMain must not use
      # JVM-only APIs). Informational — the app is Android-only for now.
      - name: iOS compile check (shared)
        continue-on-error: true
        run: gradle :shared:compileKotlinIosSimulatorArm64
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: HeadentClient-debug
          # M424-fix2: splits only — a universal APK would double the artifact,
          # it is not needed for testing on a device (it belongs only in the GitHub Release)
          path: |
            androidApp/build/outputs/apk/debug/*-arm64-v8a-*.apk
            androidApp/build/outputs/apk/debug/*-armeabi-v7a-*.apk

      - name: Build release APK (R8, for on-device testing)
        run: gradle :androidApp:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: HeadentClient-release
          # M424-fix2: splits only, the universal one is uploaded only in release.yml
          path: |
            androidApp/build/outputs/apk/release/*-arm64-v8a-*.apk
            androidApp/build/outputs/apk/release/*-armeabi-v7a-*.apk

      - name: Build release AAB (for Google Play)
        run: gradle :androidApp:bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: HeadentClient-aab
          path: androidApp/build/outputs/bundle/release/*.aab
      # M544: R8 mapping — for decoding obfuscated stack traces from the diagnostic log
      # (and for uploading to the Play Console for that build)
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v5
        with:
          name: HeadentClient-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt

